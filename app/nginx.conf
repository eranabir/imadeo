server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The SPA holds no credentials in JavaScript, but these headers reduce the
  # impact of a future rendering bug and prevent the app being embedded.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

  # The browser keeps one origin. Nginx sends API requests to the private
  # server service, so port 3001 is never published on the host.
  location /api/ {
    proxy_pass http://server:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # React Router routes must return the SPA entry point on refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
