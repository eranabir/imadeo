# A reverse proxy has already established the outside scheme. Preserve it while
# passing through the web container, otherwise the API mistakes HTTPS for the
# internal HTTP hop and emits an insecure session cookie.
map $http_x_forwarded_proto $imadeo_forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;

  # Match the API's default MAX_UPLOAD_BYTES. Nginx otherwise rejects every
  # photo or video over its 1 MB default before the request reaches Imadeo.
  client_max_body_size 50G;

  root /usr/share/nginx/html;
  index index.html;

  # The SPA holds no credentials in JavaScript, but these headers reduce the
  # impact of a future rendering bug and prevent the app being embedded.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

  # The browser keeps one origin. Nginx sends API requests to the private
  # server service on the standard Imadeo API port.
  # The mobile connection check calls `/api` without a trailing slash. Match it
  # explicitly so Nginx does not turn it into an HTTP directory redirect when
  # the browser is actually behind an HTTPS reverse proxy.
  location = /api {
    proxy_pass http://server:6666/api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $imadeo_forwarded_proto;
  }

  # A large video may finish crossing the network and then need several
  # minutes for checksum verification on a slower NAS. Nginx's default
  # 60-second upstream timeout would report a false 504 while the server was
  # still safely committing it. Keep this exception scoped to uploads.
  location = /api/assets/upload {
    proxy_pass http://server:6666;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    client_body_timeout 1h;
    proxy_connect_timeout 30s;
    proxy_send_timeout 1h;
    proxy_read_timeout 1h;
    send_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $imadeo_forwarded_proto;
  }

  location /api/ {
    proxy_pass http://server:6666;
    proxy_http_version 1.1;
    # Stream large media straight to the server's disk-backed upload handler
    # rather than first copying the entire request into Nginx temporary files.
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $imadeo_forwarded_proto;
  }

  # React Router routes must return the SPA entry point on refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
