# Publishes the container images that every install path depends on: the
# compose file, the docs, and eventually a TrueNAS catalog app all reference
# tags rather than building from source.
#
# Tag a release to publish it:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# `workflow_dispatch` builds :main without tagging, for testing the pipeline
# itself without minting a version.

name: Publish images

on:
  push:
    branches: ['master']
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required to push to GHCR with the built-in token; without it the push
      # fails at the end of a long build rather than at login.
      packages: write

    strategy:
      # One image failing should not cancel the other — they are independent,
      # and the ML build is long enough that losing it to an unrelated failure
      # wastes a lot of runner time.
      fail-fast: false
      matrix:
        include:
          - name: server
            context: .
            dockerfile: server/Dockerfile
          - name: web
            context: .
            dockerfile: app/Dockerfile
          - name: machine-learning
            context: ./machine-learning
            dockerfile: ./machine-learning/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          # A v1.2.3 tag publishes 1.2.3, 1.2 and latest, so an installation can
          # pin as loosely or as tightly as it wants.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # TerraMaster and the first supported self-hosting target are amd64.
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
