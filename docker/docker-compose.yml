name: imadeo

services:
  database:
    container_name: imadeo_postgres
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    ports:
      # Bound to loopback only, so `prisma migrate` and psql work from the host
      # during development without exposing the database to the network.
      - 127.0.0.1:${DB_PORT:-5432}:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE_NAME}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    container_name: imadeo_redis
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --save 60 1 --loglevel warning --requirepass "$$REDIS_PASSWORD"; else exec redis-server --save 60 1 --loglevel warning; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    healthcheck:
      test: ['CMD-SHELL', 'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping; else redis-cli ping; fi']
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    container_name: imadeo_server
    image: ghcr.io/eranabir/imadeo/server:${IMADEO_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOSTNAME}:5432/${DB_DATABASE_NAME}
      # Overrides the .env value, which points at localhost for host-run
      # development. Inside the network the service is reached by its name.
      ML_URL: http://machine-learning:3003
      REDIS_PORT: 6379
      SERVER_PORT: 6666
      MEDIA_LOCATION: /data
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "6666"
    ports:
      # Direct HTTP access for the LAN/VPN mode. A remote reverse proxy may
      # forward HTTPS traffic here, but never expose this port directly.
      - ${SERVER_HOST_PORT:-6666}:6666
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:6666/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  web:
    container_name: imadeo_web
    image: ghcr.io/eranabir/imadeo/web:${IMADEO_VERSION:-latest}
    restart: unless-stopped
    expose:
      - "80"
    ports:
      # Direct HTTP access for the LAN/VPN mode. A remote reverse proxy may
      # forward HTTPS traffic here, but never expose this port directly.
      - ${WEB_HOST_PORT:-1111}:80
    depends_on:
      server:
        condition: service_healthy

  machine-learning:
    container_name: imadeo_ml
    image: ghcr.io/eranabir/imadeo/machine-learning:${IMADEO_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TRANSFORMERS_CACHE: /cache
      HF_HOME: /cache
    volumes:
      - ${MODEL_CACHE_LOCATION}:/cache
    ports:
      # Loopback only, like the database and Redis. The server streams image
      # bytes over HTTP rather than sharing a volume, so a server running on
      # the host during development needs this port to reach the models.
      - 127.0.0.1:${IMADEO_ML_PORT:-3003}:3003
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3003/health').status==200 else 1)"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s

volumes:
  model-cache:
