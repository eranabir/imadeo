# Use a real node_modules tree rather than Plug'n'Play. sharp, exiftool-vendored
# and the Prisma engines ship platform binaries that expect to be found on disk.
nodeLinker: node-modules

# Yarn 4 blocks package build scripts by default. Several dependencies here are
# native or download an engine at install time and genuinely need theirs to run.
enableScripts: true

enableTelemetry: false

yarnPath: .yarn/releases/yarn-4.18.0.cjs
